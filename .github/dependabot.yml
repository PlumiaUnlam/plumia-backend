version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    groups:
      nestjs:
        patterns:
          - '@nestjs/*'
      typescript-tools:
        patterns:
          - 'typescript'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'ts-jest'
          - 'ts-node'
          - 'ts-loader'
      testing:
        patterns:
          - 'jest'
          - '@types/jest'
          - 'supertest'
          - '@types/supertest'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(docker)'
