services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: plumia_postgres
    environment:
      POSTGRES_USER: plumia
      POSTGRES_PASSWORD: plumia_dev
      POSTGRES_DB: plumia_development
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U plumia']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: plumia_redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
