services:
  api:
    build:
      context: .
    container_name: plumia_api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://plumia:plumia_dev@postgres:5432/plumia_development
      DIRECT_URL: postgresql://plumia:plumia_dev@postgres:5432/plumia_development
      REDIS_URL: redis://redis:6379
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-service-account.json
      STT_PROVIDER: local
      LOCAL_WHISPER_URL: http://whisper:8001
    ports:
      - '3000:3000'
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      whisper:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg15
    container_name: plumia_postgres
    environment:
      POSTGRES_USER: plumia
      POSTGRES_PASSWORD: plumia_dev
      POSTGRES_DB: plumia_development
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U plumia']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: plumia_redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  whisper:
    build:
      context: .
      dockerfile: scripts/local-whisper/Dockerfile
    container_name: plumia_whisper
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_HOST: 0.0.0.0
      WHISPER_PORT: 8001
    ports:
      - '127.0.0.1:8001:8001'
    volumes:
      - whisper-models:/home/whisper/.cache/huggingface
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
  redisdata:
  whisper-models:
