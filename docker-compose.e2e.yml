services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: plumia_e2e_postgres
    environment:
      POSTGRES_USER: plumia_e2e
      POSTGRES_PASSWORD: plumia_e2e
      POSTGRES_DB: plumia_e2e
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U plumia_e2e -d plumia_e2e']
      interval: 2s
      timeout: 5s
      retries: 20
