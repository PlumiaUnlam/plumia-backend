# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'es-ES'

reviews:
  profile: 'chill'
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  path_instructions:
    - path: 'src/**/*.ts'
      instructions: |
        Revisa prácticas backend NestJS/TypeScript según la arquitectura PlumIA:
        monolito modular, Clean/Hexagonal, contratos primero y separación
        domain/application/infrastructure. Señala any innecesario, promesas sin await,
        console/debugger, secretos hardcodeados, catch que silencian errores, logs de
        manuscritos/API keys/datos personales, lógica de negocio dentro de controllers,
        DTOs sin validación y acoplamiento directo a Prisma, BullMQ, proveedores IA o
        HTTP fuera de infrastructure.
    - path: 'src/**/domain/**/*.ts'
      instructions: |
        Domain debe contener entidades, value objects, errores y reglas puras. No debe
        importar NestJS, Prisma, Redis, HTTP, BullMQ ni infrastructure/application.
    - path: 'src/**/application/**/*.ts'
      instructions: |
        Application define puertos/interfaces y casos de uso. No debe depender de
        infrastructure concreta; si necesita datos de otro módulo, debe usar una interfaz.
    - path: '.github/workflows/**/*'
      instructions: |
        Revisa que los workflows sean reproducibles, usen versiones fijas cuando aplique,
        ejecuten lint, typecheck, tests y build, no expongan secretos y no dupliquen
        checks innecesariamente.

chat:
  auto_reply: true
